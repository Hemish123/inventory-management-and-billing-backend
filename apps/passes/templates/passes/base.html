<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Navratri Face Pass — Secure entry verification with face recognition">
    <title>{% block title %}Navratri Face Pass{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'passes/css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block body %}
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="container">
                <div class="d-flex align-items-center gap-2">
                    <span class="header-icon">🪔</span>
                    <div>
                        <h1 class="header-title">Navratri Face Pass</h1>
                        <p class="header-subtitle">{% block header_subtitle %}Secure Entry Verification{% endblock %}</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main content -->
        <main class="app-main">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container text-center">
                <small class="text-muted">
                    🪔 Navratri Face Pass &bull; Secure &bull; Private &bull; Fast
                </small>
            </div>
        </footer>
    </div>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
